name: Docs

on:
  push:
  pull_request:

jobs:
  required-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required documentation
        run: |
          set -euo pipefail

          required_files=(
            "AGENTS.md"
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "ROADMAP.md"
            "DIAGNOSTICO_INICIAL.md"
            "specs/VISION.md"
            "specs/ARCHITECTURE.md"
            "specs/AGENTS.md"
            "specs/MCP.md"
            "specs/SECURITY.md"
            "docs/adr/0000-template.md"
            "docs/adr/0001-base-local-first.md"
            "docs/adr/0002-swiftui-python-process-bridge.md"
            "docs/adr/0003-mcp-permission-model.md"
            "docs/adr/0004-mcp-confirmation-ui.md"
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

      - name: Check README normalization
        run: |
          set -euo pipefail
          ! grep -F "cat > README.md" README.md
